<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="一些用来理解概念的交互式小页面：加密算法、字节与编码、计算机网络、产品方法论、AI Agent、微服务。">
<meta property="og:title" content="learning labs">
<meta property="og:description" content="一些用来理解概念的交互式小页面：加密算法、字节与编码、计算机网络、产品方法论、AI Agent、微服务。">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<title>learning labs · index</title>
<link rel="stylesheet" href="/assets/fonts.css">
<link rel="stylesheet" href="/assets/base.css">
<style>
  :root{
    --bg:#06070b;
    --bg-2:#0c0e16;
    --panel:#10131d;
    --line:#1d2230;
    --line-2:#262c3d;
    --ink:#e6e8ee;
    --muted:#7b8298;
    --faint:#4a5066;
    --accent:#7cf0c2;
    --accent-2:#ffb648;
    --accent-3:#8aa9ff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
  body{
    min-height:100vh;
    background:
      radial-gradient(900px 600px at 85% -10%, rgba(124,240,194,0.06), transparent 60%),
      radial-gradient(700px 500px at -10% 110%, rgba(255,182,72,0.05), transparent 60%),
      var(--bg);
    display:flex;flex-direction:column;
  }
  .wrap{max-width:980px;margin:0 auto;padding:48px 28px 96px;width:100%;flex:1}

  /* top bar */
  .topbar{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:18px;gap:24px;flex-wrap:wrap}
  .brand{font-weight:700;font-size:13px;letter-spacing:0.04em}
  .brand .dot{display:inline-block;width:8px;height:8px;background:var(--accent);border-radius:50%;margin-right:8px;vertical-align:middle;box-shadow:0 0 12px var(--accent)}
  .meta{color:var(--muted);font-size:12px;display:flex;gap:18px;flex-wrap:wrap}
  .meta span b{color:var(--ink);font-weight:500}

  /* hero */
  .hero{margin:40px 0 12px}
  .kicker{color:var(--accent);font-size:12px;letter-spacing:0.18em;text-transform:uppercase;margin-bottom:18px}
  h1{font-family:'Inter',sans-serif;font-size:clamp(34px,5.5vw,56px);font-weight:600;letter-spacing:-0.02em;line-height:1.05;max-width:820px}
  h1 .slash{color:var(--faint);font-weight:400}
  h1 .hl{color:var(--accent)}
  .lede{margin-top:22px;color:var(--muted);max-width:640px;font-size:14px;line-height:1.7}
  .lede code{color:var(--ink);background:var(--bg-2);padding:1px 6px;border-radius:3px;border:1px solid var(--line)}

  /* section heading */
  .sec-head{display:flex;justify-content:space-between;align-items:flex-end;margin:12px 0 18px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
  .sec-head h2{font-family:'Inter',sans-serif;font-weight:600;font-size:13px;letter-spacing:0.16em;text-transform:uppercase;color:var(--muted)}
  .sec-head .count{color:var(--faint);font-size:11px}

  /* lab cards */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
  .card{
    position:relative;
    background:var(--panel);
    border:1px solid var(--line);
    padding:22px 22px 20px;
    text-decoration:none;color:inherit;
    display:flex;flex-direction:column;gap:14px;
    transition:border-color .18s ease, transform .18s ease, background .18s ease;
    overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--accent);
    opacity:0;transition:opacity .18s ease;
  }
  .card:hover{border-color:var(--line-2);background:#11141f;transform:translateY(-1px)}
  .card:hover::before{opacity:1}
  .card[data-accent="amber"]::before{background:var(--accent-2)}
  .card[data-accent="blue"]::before{background:var(--accent-3)}

  .card-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .card-path{color:var(--faint);font-size:11px;letter-spacing:0.04em}
  .card-tag{font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line-2);padding:2px 7px;border-radius:2px}
  .card-title{font-family:'Inter',sans-serif;font-weight:600;font-size:22px;letter-spacing:-0.01em;color:var(--ink)}
  .card-sub{color:var(--muted);font-size:13px;line-height:1.55}
  .card-foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:12px;border-top:1px dashed var(--line)}
  .card-foot .topics{display:flex;gap:8px;flex-wrap:wrap}
  .card-foot .topics span{color:var(--faint);font-size:11px}
  .card-foot .topics span::before{content:"#";color:var(--line-2);margin-right:2px}
  .card-foot .go{color:var(--accent);font-size:12px;letter-spacing:0.04em}
  .card[data-accent="amber"] .card-foot .go{color:var(--accent-2)}
  .card[data-accent="blue"] .card-foot .go{color:var(--accent-3)}

  /* filter bar */
  .filters{display:flex;gap:10px;margin:0 0 16px;flex-wrap:wrap;align-items:center}
  .filters .tags{display:flex;gap:6px;flex-wrap:wrap}
  .tag-btn{
    font-family:inherit;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;
    color:var(--muted);background:transparent;border:1px solid var(--line-2);
    padding:4px 9px;border-radius:2px;cursor:pointer;
    transition:color .15s ease, border-color .15s ease;
  }
  .tag-btn:hover{color:var(--ink);border-color:var(--faint)}
  .tag-btn.on{color:var(--bg);background:var(--accent);border-color:var(--accent)}
  .search{
    flex:1;min-width:180px;max-width:300px;margin-left:auto;
    font-family:inherit;font-size:12px;color:var(--ink);
    background:var(--bg-2);border:1px solid var(--line);border-radius:2px;
    padding:6px 10px;outline:none;
  }
  .search::placeholder{color:var(--faint)}
  .search:focus{border-color:var(--accent)}
  .no-hit{color:var(--faint);font-size:12px;padding:24px 0;display:none}

  /* placeholder card */
  .card.placeholder{border-style:dashed;background:transparent;cursor:default;color:var(--faint)}
  .card.placeholder:hover{transform:none;background:transparent;border-color:var(--line)}
  .card.placeholder::before{display:none}
  .card.placeholder .card-title{color:var(--faint);font-style:italic}

  /* footer */
  footer{
    border-top:1px solid var(--line);
    margin-top:80px;padding:20px 28px;
    color:var(--faint);font-size:11px;
    display:flex;justify-content:space-between;gap:18px;flex-wrap:wrap;
    max-width:980px;margin-left:auto;margin-right:auto;width:100%;
  }
  footer a{color:var(--muted);text-decoration:none;border-bottom:1px dashed var(--line-2)}
  footer a:hover{color:var(--ink)}
  .gh-link{display:inline-flex;align-items:center;color:var(--muted);border-bottom:none}
  .gh-link:hover{color:var(--ink)}
  .gh-link svg{width:18px;height:18px;fill:currentColor;transition:fill .15s ease}
  .cursor{display:inline-block;width:8px;height:14px;background:var(--accent);vertical-align:-2px;margin-left:4px;animation:blink 1.1s steps(2) infinite}
  @keyframes blink{50%{opacity:0}}

  @media (max-width:560px){
    .wrap{padding:32px 20px 64px}
    .hero{margin:28px 0 12px}
    .card{padding:18px}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div class="brand"><span class="dot"></span>LEARNING&nbsp;LABS</div>
      <div class="meta">
        <a class="gh-link" href="https://github.com/chinatsu1124/learning-labs" aria-label="GitHub 仓库" title="GitHub 仓库"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg></a>
      </div>
    </header>

    <section class="hero">
      <div class="kicker">// 实验索引</div>
      <h1><span class="slash">~/</span>learning-<span class="hl">labs</span><span class="cursor"></span></h1>
      <p class="lede">一些写着玩、用来理解概念的小页面。每个 lab 是独立的静态站，放在 <code>/&lt;slug&gt;/</code> 下。后面会持续加。</p>
    </section>

    <div class="sec-head">
      <h2>&gt; 实验列表</h2>
      <span class="count" id="lab-count"></span>
    </div>

    <div class="filters" id="filters" hidden>
      <div class="tags" id="tag-row"></div>
      <input class="search" id="search" type="search" placeholder="搜索 lab / 主题 …" autocomplete="off">
    </div>

    <div class="grid" id="grid">
      <noscript><a class="card" href="https://github.com/chinatsu1124/learning-labs">lab 列表需要 JavaScript 渲染，也可以直接看 GitHub 仓库的 README。</a></noscript>
    </div>
    <p class="no-hit" id="no-hit">没有匹配的 lab。</p>
  </div>

  <footer>
    <span>© chinatsu1124 · 静态站 · 托管于 Cloudflare Pages</span>
    <span><a class="gh-link" href="https://github.com/chinatsu1124/learning-labs" aria-label="GitHub 仓库" title="source on GitHub"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg></a></span>
  </footer>
  <script>
    /* 卡片从 /labs.json 渲染（单一数据源，加新 lab 只改 json）；
     * tag 筛选 + 关键词搜索都在客户端完成。 */
    (function(){
      var ACCENTS = ['', 'amber', 'blue'];
      var pad = function(n){ return String(n).padStart(2, '0'); };
      var grid = document.getElementById('grid');
      var labs = [];
      var activeTag = 'all';
      var query = '';

      function esc(s){
        return String(s).replace(/[&<>"]/g, function(c){
          return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
        });
      }

      function card(lab, i){
        var a = document.createElement('a');
        a.className = 'card';
        a.href = lab.path;
        var accent = ACCENTS[i % ACCENTS.length];
        if (accent) a.dataset.accent = accent;
        a.innerHTML =
          '<div class="card-row">' +
            '<span class="card-path">' + esc(lab.path) + '</span>' +
            '<span class="card-tag">' + esc(lab.tag) + '</span>' +
          '</div>' +
          '<div class="card-title">' + esc(lab.title) + '</div>' +
          '<div class="card-sub">' + esc(lab.sub) + '</div>' +
          '<div class="card-foot">' +
            '<div class="topics">' + lab.topics.map(function(t){ return '<span>' + esc(t) + '</span>'; }).join('') + '</div>' +
            '<span class="go">进入 →</span>' +
          '</div>';
        return a;
      }

      function placeholder(){
        var d = document.createElement('div');
        d.className = 'card placeholder';
        d.innerHTML =
          '<div class="card-row"><span class="card-path">/_/</span><span class="card-tag">tbd</span></div>' +
          '<div class="card-title">敬请期待</div>' +
          '<div class="card-sub">下一个 lab 还在草稿里。</div>' +
          '<div class="card-foot"><div class="topics"><span>wip</span></div>' +
          '<span class="go" style="color:var(--faint)">—</span></div>';
        return d;
      }

      function matches(lab){
        if (activeTag !== 'all' && lab.tag !== activeTag) return false;
        if (!query) return true;
        var hay = [lab.path, lab.tag, lab.title, lab.sub].concat(lab.topics).join(' ').toLowerCase();
        return query.split(/\s+/).every(function(w){ return hay.indexOf(w) !== -1; });
      }

      function render(){
        grid.textContent = '';
        var shown = 0;
        labs.forEach(function(lab, i){
          if (!matches(lab)) return;
          grid.appendChild(card(lab, i));
          shown++;
        });
        var filtering = activeTag !== 'all' || query;
        if (!filtering) grid.appendChild(placeholder());
        document.getElementById('no-hit').style.display = shown ? 'none' : 'block';
        document.getElementById('lab-count').textContent = filtering
          ? pad(shown) + ' / ' + pad(labs.length) + ' 个'
          : pad(labs.length) + ' 个 · 持续更新中';
      }

      function buildFilters(){
        var row = document.getElementById('tag-row');
        var tags = ['all'].concat(labs.map(function(l){ return l.tag; })
          .filter(function(t, i, arr){ return arr.indexOf(t) === i; }));
        tags.forEach(function(tag){
          var b = document.createElement('button');
          b.className = 'tag-btn' + (tag === activeTag ? ' on' : '');
          b.type = 'button';
          b.textContent = tag;
          b.addEventListener('click', function(){
            activeTag = tag;
            row.querySelectorAll('.tag-btn').forEach(function(x){ x.classList.toggle('on', x === b); });
            render();
          });
          row.appendChild(b);
        });
        document.getElementById('search').addEventListener('input', function(e){
          query = e.target.value.trim().toLowerCase();
          render();
        });
        document.getElementById('filters').hidden = false;
      }

      fetch('/labs.json')
        .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function(data){
          labs = data.labs;
          buildFilters();
          render();
        })
        .catch(function(err){
          grid.innerHTML = '<p class="no-hit" style="display:block">labs.json 加载失败：' + esc(err.message) + '</p>';
        });
    })();
  </script>
</body>
</html>
